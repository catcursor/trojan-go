name: release-build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.10.6-catcursor.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  PACKAGE_NAME: github.com/catcursor/trojan-go

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Test
        env:
          SHADOWSOCKS_SF_CAPACITY: "-1"
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check vulnerabilities
        run: $(go env GOPATH)/bin/govulncheck -scan=symbol ./...

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
          - name: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - name: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
            ext: ".exe"
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag_name }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "VERSION=${tag}" >> "${GITHUB_ENV}"
          echo "COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Download routing data
        shell: bash
        run: |
          mkdir -p dist
          curl -fL https://github.com/v2fly/domain-list-community/raw/release/dlc.dat -o dist/geosite.dat
          curl -fL https://github.com/v2fly/geoip/raw/release/geoip.dat -o dist/geoip.dat
          curl -fL https://github.com/v2fly/geoip/raw/release/geoip-only-cn-private.dat -o dist/geoip-only-cn-private.dat

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        shell: bash
        run: |
          set -euo pipefail

          out_dir="dist/trojan-go-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir -p "${out_dir}"

          go build \
            -tags "full" \
            -trimpath \
            -ldflags "-s -w -buildid= -X ${PACKAGE_NAME}/constant.Version=${VERSION} -X ${PACKAGE_NAME}/constant.Commit=${COMMIT}" \
            -o "${out_dir}/trojan-go${{ matrix.ext }}" \
            .

          cp LICENSE README.md "${out_dir}/"
          cp dist/geosite.dat dist/geoip.dat dist/geoip-only-cn-private.dat "${out_dir}/"
          cp -R example "${out_dir}/example"

      - name: Package
        shell: bash
        run: |
          cd dist
          zip -qr "trojan-go-${RELEASE_TAG}-${{ matrix.name }}.zip" "trojan-go-${RELEASE_TAG}-${{ matrix.name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trojan-go-${{ env.RELEASE_TAG }}-${{ matrix.name }}
          path: dist/trojan-go-${{ env.RELEASE_TAG }}-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ inputs.tag_name }}" >> "${GITHUB_ENV}"
            echo "PRERELEASE=${{ inputs.prerelease }}" >> "${GITHUB_ENV}"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
            echo "PRERELEASE=false" >> "${GITHUB_ENV}"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Trojan-Go ${{ env.RELEASE_TAG }}
          prerelease: ${{ env.PRERELEASE }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
